name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rules-and-puzzles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
